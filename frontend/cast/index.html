<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nébula · Chromecast</title><link rel="stylesheet" href="app.css"><script defer src="app.js"></script></head>
<body><main><div class="brand">NÉBULA<span>.</span></div><p class="eyebrow">EN TU TELEVISOR</p><h1 id="title">Preparando Chromecast…</h1><p class="intro">Elige tu televisor y disfruta el contenido en pantalla grande.</p>
<section class="device"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 14V8h38v30H28M5 24a14 14 0 0 1 14 14M5 31a7 7 0 0 1 7 7"/><circle cx="5" cy="38" r="1.5"/></svg><div><span class="label">CHROMECAST</span><h2 id="device">Sin conectar</h2></div><button id="choose" disabled>Elegir televisor</button></section>
<p id="preferences" class="preferences" hidden></p><p id="status" role="status">Iniciando conexión con Google Cast…</p><p id="audio-notice" class="audio-notice" role="status" hidden></p><div class="actions"><button id="send" class="primary" disabled>Reproducir en TV</button><button id="pause" disabled>Pausar</button><button id="stop" disabled>Detener envío</button></div>
<p class="hint">La PC y el televisor deben estar en la misma red. Mantén Nébula abierto durante la reproducción.</p><button id="close" class="quiet">Cerrar control</button></main></body></html>
