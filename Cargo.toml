[package]
name = "xuper-windows"
version = "0.6.2"
edition = "2024"
description = "Cliente de escritorio Windows reconstruido desde Xuper Mobile"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
des = "0.8"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
base64 = "0.22"
md-5 = "0.10"
hex = "0.4"
sha2 = "0.10.9"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
tiny_http = { version = "0.12.0", default-features = false }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
tao = { version = "0.37.1", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57.0", default-features = false, features = ["os-webview"] }
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_LibraryLoader"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

